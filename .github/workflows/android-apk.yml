name: Compilar APK Rebeca 2.1
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'assets/icone-rebeca-android.png'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebeca-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Gerar ícone original do Villa Europa
        run: |
          python -m pip install --quiet cairosvg pillow
          python android-app/gera_icone.py

      - name: Compilar aplicativo Android
        working-directory: android-app
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Preparar APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Rebeca-2.1-Villa-Europa-Android.apk

      - name: Disponibilizar artefato na execução
        uses: actions/upload-artifact@v4
        with:
          name: Rebeca-2.1-Villa-Europa-APK
          path: Rebeca-2.1-Villa-Europa-Android.apk
          if-no-files-found: error

      - name: Publicar link direto do APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view rebeca-2.1-android >/dev/null 2>&1; then
            gh release upload rebeca-2.1-android Rebeca-2.1-Villa-Europa-Android.apk --clobber
          else
            gh release create rebeca-2.1-android Rebeca-2.1-Villa-Europa-Android.apk \
              --title "Rebeca 2.1 - Villa Europa (APK Android)" \
              --notes "Versão Android de testes. Interface oficial Rebeca 2.1 conectada ao site do Residencial Villa Europa. Requer conexão com a internet. Instalação manual via APK (fora da Play Store)."
          fi
